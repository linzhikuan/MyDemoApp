# Android CI/CD Pipeline

stages:
  - build
  - test
  - deploy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_HOME: "/opt/android-sdk"
  DOCKER_DRIVER: overlay2
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"
  JAVA_OPTS: "-Xmx1g"

before_script:
  - apt-get update && apt-get install -y openjdk-17-jdk wget unzip git sudo
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
  - mkdir -p $ANDROID_HOME/cmdline-tools
  - unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
  - yes | sdkmanager --licenses 2>/dev/null || true
  - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
  - echo "sdk.dir=$ANDROID_HOME" > local.properties
  - cat local.properties
  - chmod +x ./gradlew

build:
  stage: build
  image: ubuntu:22.04
  tags:
    - android
  script:
    - echo "Starting build..."
    - ./gradlew assembleDebug --no-daemon --stacktrace > build_output.log 2>&1
  after_script:
    - echo "=== Build output (last 200 lines) ==="
    - tail -200 build_output.log
    - echo "=== End of build output ==="
  artifacts:
    paths:
      - build_output.log
      - "**/build/outputs/apk/debug/*.apk"
    expire_in: 1 week
    when: always
  only:
    - main
    - develop
    - merge_requests

unit_test:
  stage: test
  image: ubuntu:22.04
  tags:
    - android
  script:
    - ./gradlew testDebugUnitTest --no-daemon --stacktrace
  artifacts:
    reports:
      junit: "**/build/test-results/testDebugUnitTest/TEST-*.xml"
    expire_in: 1 week
    when: always
  only:
    - main
    - develop
    - merge_requests

lint:
  stage: test
  image: ubuntu:22.04
  tags:
    - android
  script:
    - ./gradlew lintDebug --no-daemon --stacktrace
  artifacts:
    paths:
      - "**/build/reports/lint-results-debug.html"
    expire_in: 1 week
    when: always
  only:
    - main
    - develop
    - merge_requests

build_release:
  stage: deploy
  image: ubuntu:22.04
  tags:
    - android
  script:
    - ./gradlew assembleRelease --no-daemon --stacktrace
  artifacts:
    paths:
      - "**/build/outputs/apk/release/*.apk"
    expire_in: 1 month
    when: always
  only:
    - main
  when: manual
