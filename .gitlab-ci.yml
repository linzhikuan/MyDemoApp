# Android CI/CD Pipeline

stages:
  - build

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_HOME: "/opt/android-sdk"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
  JAVA_OPTS: "-Xmx1536m"

before_script:
  - echo "=== System info ==="
  - uname -a
  - dpkg --print-architecture
  - echo "=== Installing packages ==="
  - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk wget unzip git sudo > /dev/null 2>&1
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)
  - echo "JAVA_HOME=$JAVA_HOME"
  - echo "=== Setting up Android SDK ==="
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
  - mkdir -p $ANDROID_HOME/cmdline-tools
  - unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
  - yes | sdkmanager --licenses 2>/dev/null || true
  - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
  - echo "sdk.dir=$ANDROID_HOME" > local.properties
  - cat local.properties
  - chmod +x ./gradlew

build:
  stage: build
  image: ubuntu:22.04
  script:
    - echo "=== Starting build $(date) ==="
    - ./gradlew assembleDebug --no-daemon --stacktrace
  artifacts:
    paths:
      - "**/build/outputs/apk/debug/*.apk"
    expire_in: 1 week
    when: on_success
