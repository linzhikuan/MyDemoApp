stages:
  - build

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_HOME: "/opt/android-sdk"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"

build:
  stage: build
  image: android-ci:amd64
  before_script:
    - echo "=== System info ==="
    - uname -a
    - free -m
    - echo "JAVA_HOME=$JAVA_HOME"
    - echo "ANDROID_HOME=$ANDROID_HOME"
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - chmod +x ./gradlew
  script:
    - echo "=== Starting build ==="
    - ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=2 --stacktrace
  artifacts:
    paths:
      - "**/build/outputs/apk/debug/*.apk"
    expire_in: 1 week
    when: on_success
