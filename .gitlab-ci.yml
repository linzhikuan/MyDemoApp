# Android CI/CD Pipeline
# 使用基础镜像 + Android SDK

stages:
  - build
  - test
  - deploy

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  DOCKER_DRIVER: overlay2
  GIT_STRATEGY: clone
  GIT_DEPTH: 1
  GIT_CLONE_PATH: /builds/$CI_COMMIT_REF_SLUG
  GIT_CLONE_URL: http://gitlab/linzhikuan/mydemoapp.git

# 构建阶段
build:
  stage: build
  image: ubuntu:22.04
  tags:
    - android
  before_script:
    - apt-get update && apt-get install -y openjdk-17-jdk wget unzip git sudo
    - wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
    - unzip -q /tmp/gradle.zip -d /opt
    - ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - mkdir -p /opt/android-sdk/cmdline-tools
    - unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
    - mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses 2>/dev/null || true
    - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
    - chmod +x ./gradlew
  script:
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - chmod +x ./gradlew
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests

# 单元测试
unit_test:
